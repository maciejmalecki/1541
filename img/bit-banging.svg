  <title id="t">Designed for 4 microseconds per bit; shipped at 20</title>
  <desc id="d">The bus was designed around a hardware shift register at 4 microseconds per bit. What shipped falls back to CPU bit-banging at both ends, 20 microseconds per bit. Two bars on one scale make the five-fold slowdown visible.</desc>
