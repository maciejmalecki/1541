  <title id="t">Dodge the badline instead of accommodating it</title>
  <desc id="d">Two contrasted timelines. Commodore's row is one full-width dimmed bar: the entire protocol slowed, permanently. The fastloader row alternates wide accent transfer bursts with narrow dimmed badline gaps, with markers under the bursts: the interference is periodic and therefore schedulable.</desc>
