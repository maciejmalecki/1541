    attributes. Recorded here so a theme change can find this figure.

    VISUAL LANGUAGE, shared with badline-timeline.svg · the two must read as
    one system: reduced-opacity white = time lost (the vocabulary's ░), accent
    = useful transfer, solid triangles = markers on a periodic schedule · here
    they sit under the bursts, because the bursts are what the period buys.
    PROPORTION: the badline steals ~40 of ~500 µs, so the fastloader's dimmed
