<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
  <title id="t">The IBM 23FD "Minnow", 1971</title>
  <desc id="d">An 8-inch read-only floppy diskette holding 80 KiB, roughly equivalent to 3,000 punched cards.</desc>
  <!--
    PLAN-0004 Phase 1, hand-authored. Replaces the fenced ASCII block at
    decks/c64-1541/slides.md:126.

    THEME TOKENS, resolved at generation time from src/theme/slides.scss:25-43.
    An external asset inherits no CSS from the deck, so these are written in —
    and recorded here so a later theme change can find them (PLAN-0004 Req. 2).
      background      #111      ($background-color)
      foreground      #fff      ($main-color / $heading-color)
      accent          #e7ad52   ($active-color)
      heading font    Montserrat, Impact, sans-serif
      body font       'Open Sans', sans-serif
    No <style> block and no CSS classes: reveal does not style external SVG,
    so every value is a presentation attribute.
  -->
  <rect width="760" height="340" fill="#111"/>

  <!-- the jacket -->
  <rect x="40" y="40" width="360" height="260" rx="8" fill="none" stroke="#fff" stroke-width="3"/>

  <!-- the magnetic surface: the ████ fill of the original, as a real shape -->
  <rect x="72" y="72" width="296" height="196" fill="#e7ad52" opacity="0.18"/>
  <rect x="72" y="72" width="296" height="196" fill="none" stroke="#e7ad52" stroke-width="2"/>

  <!-- the hub: ( ● ) -->
  <circle cx="220" cy="170" r="46" fill="none" stroke="#e7ad52" stroke-width="2"/>
  <circle cx="220" cy="170" r="16" fill="#e7ad52"/>

  <!-- right-hand annotations, which the ASCII placed beside the box -->
  <g font-family="'Open Sans', sans-serif" font-size="26" fill="#fff">
    <text id="size" x="440" y="86">8 inches</text>
    <text id="read-only" x="440" y="146" fill="#e7ad52" font-weight="600">READ ONLY</text>
    <text id="capacity" x="440" y="206">80 KiB</text>
    <text id="punched-cards" x="440" y="266" font-size="22" opacity="0.85">&#8776; 3,000 punched cards</text>
  </g>

  <!-- leader lines, replacing the ASCII's implicit alignment -->
  <g stroke="#fff" stroke-width="1" opacity="0.35">
    <line x1="404" y1="78" x2="430" y2="78"/>
    <line x1="404" y1="138" x2="430" y2="138"/>
    <line x1="404" y1="198" x2="430" y2="198"/>
    <line x1="404" y1="258" x2="430" y2="258"/>
  </g>
</svg>
