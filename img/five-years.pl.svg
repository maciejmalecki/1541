  <title id="t">Pięć lat, by dostarczyć szynę zgodną z projektem</title>
  <desc id="d">Prędkości transmisji na jednej skali: założenia projektowe z 1980 roku powyżej 10 KB/s; VIC-20 z 1540 w 1981 roku najwyżej około 0,5 KB/s, po błędzie i obejściu; C64 z 1541 w 1982 roku około 0,4 KB/s, czyli gorzej; fastloadery społeczności około 5–6 KB/s w 1984 roku; własne C128 z 1571 Commodore w 1986 roku, 4–5 KB/s — nareszcie; oraz Transwarp z rekordem 19 KB/s, około pięćdziesiąt razy szybciej niż fabrycznie, na tym samym przewodzie w 2020 roku.</desc>
  <!--
    Generated by the svg-diagram skill.
    Source: the fenced ASCII block formerly in decks/c64-1541/slides.md (slide "Commodore's fix: 1986").
    DATA CORRECTED 2026-09-25 by the author: 1984 fastloaders are ~5 to 6 KB/s (not ~16);
    C128 Fast Serial is 4 to 5 KB/s (not ~2.1); the 19 KB/s (~50x) record is Transwarp,
    2020, on the same wire.

    The bars are NOT in the ASCII: each renders its row's KB/s figure on ONE shared linear
    scale, 28u per KB/s (1980 uses 10, 1981 uses 0.5, 1982 uses 0.4, 1984 uses 5.5,
    1986 uses 4.5, 2020 uses 19). Accent bars with bold text are the COMMUNITY software
    rows (1984 fastloaders, 2020 Transwarp); Commodore's own rows are white at reduced
    opacity. Bold text reinforces, so the distinction is never colour alone. The 2020 row
    sits after a wider gap: the timeline is categorical, and the gap marks the 34-year jump.

    THEME TOKENS, read from src/theme/slides.scss:25-43 at generation time:
      $background-color #111    · $main-color / $heading-color #fff
      $active-color     #e7ad52
      $heading-font     'Montserrat', Impact, sans-serif
      $main-font        'Open Sans', sans-serif
    An external asset inherits no CSS from the deck, so these are presentation
    attributes. Recorded here so a theme change can find this figure.
  -->
  <rect width="860" height="545" fill="#111"/>

  <!-- 1980 · design intent · >10 KB/s -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1980" x="40" y="60" font-family="'Montserrat', Impact, sans-serif" font-size="30" letter-spacing="-0.03">1980</text>
    <text id="product-1980" x="145" y="60">założenia projektowe</text>
    <rect x="145" y="74" width="280" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1980" x="437" y="89">&gt; 10 KB/s</text>
  </g>

  <!-- 1981 · VIC-20/1540 · no more than ~0.5 KB/s (bug + workaround) -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1981" x="40" y="145" font-family="'Montserrat', Impact, sans-serif" font-size="30" letter-spacing="-0.03">1981</text>
    <text id="product-1981" x="145" y="145">VIC-20/1540</text>
    <text id="note-1981" x="560" y="145" font-size="20" opacity="0.6">(błąd + obejście)</text>
    <rect x="145" y="159" width="14" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1981" x="171" y="174">≤ 0,5 KB/s</text>
  </g>

  <!-- 1982 · C64/1541 · ~0.4 KB/s, the 403 bytes/sec of the stock-rate slide (worse) -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1982" x="40" y="230" font-family="'Montserrat', Impact, sans-serif" font-size="30" letter-spacing="-0.03">1982</text>
    <text id="product-1982" x="145" y="230">C64/1541</text>
    <text id="note-1982" x="560" y="230" font-size="20" opacity="0.6">(gorzej)</text>
    <rect x="145" y="244" width="11" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1982" x="168" y="259">~0,4 KB/s</text>
  </g>

  <!-- 1984 · fastloaders · ~5 to 6 KB/s (community) · accent: community software,
       and it beats Commodore's own 1986 fix two years before that fix ships. -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1984" x="40" y="315" font-family="'Montserrat', Impact, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.03">1984</text>
    <text id="product-1984" x="145" y="315" font-weight="700">fastloadery</text>
    <text id="note-1984" x="560" y="315" font-size="20" opacity="0.6">(społeczność)</text>
