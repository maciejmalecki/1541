    <text id="product-1986" x="145" y="400">C128/1571</text>
    <text id="note-1986" x="560" y="400" font-size="20" opacity="0.6">(Commodore, nareszcie)</text>
    <rect x="145" y="414" width="126" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1986" x="283" y="429">4&#8211;5 KB/s</text>
