      <rect x="60"  y="0" width="56" height="48" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="120" y="0" width="56" height="48" fill="#e7ad52" stroke="#e7ad52" stroke-width="2"/>
      <rect x="180" y="0" width="56" height="48" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="240" y="0" width="56" height="48" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="28"  y="32" fill="#fff" text-anchor="middle">0</text>
