      $heading-font     'Montserrat', Impact, sans-serif
      $main-font        'Open Sans', sans-serif
    An external asset inherits no CSS from the deck, so these are presentation
    attributes. Recorded here so a theme change can find this figure.

    Two stacked parts. Top: the five buffers, cell 2 held hostage (accent fill,
    solid triangle marker beneath, pointing UP at that one cell — the ASCII's
    &#9650; composite). Bottom: the consequence chain, the ASCII's indented
    &#9492;&#9472;&#9472;&#9658; tree rendered as a stepped cascade, each step
