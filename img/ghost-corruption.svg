<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-labelledby="t d">
  <title id="t">How a phantom drive 1 corrupts a disk</title>
  <desc id="d">Buffer 2 of five is allocated to a drive that does not exist, and cannot be stolen because it errored. Save-with-replace needs all five buffers but finds only four, so it steals the BAM buffer instead; then only two track images fit, and the BAM may be updated correctly, be left unchanged, or be fully allocated.</desc>
