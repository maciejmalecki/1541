<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="t d">
  <title id="t">Badline DMA breaks the software bit timing</title>
  <desc id="d">A horizontal CPU timeline alternating long running spans with short halted slices. Markers under two halted slices note that badline DMA halts the CPU for about 40 microseconds, every roughly 500 microseconds, which breaks the 20 microsecond software bit timing.</desc>
  <!--
    Generated by the svg-diagram skill.
    Source: the fenced ASCII block under decks/c64-1541/slides.md:443
    ("3. The VIC-II sabotaged it").

    THEME TOKENS, read from src/theme/slides.scss:25-43 at generation time:
      $background-color #111    · $main-color / $heading-color #fff
      $active-color     #e7ad52
      $heading-font     'Montserrat', Impact, sans-serif
      $main-font        'Open Sans', sans-serif
    An external asset inherits no CSS from the deck, so these are presentation
    attributes. Recorded here so a theme change can find this figure.

    VISUAL LANGUAGE, shared with dodge-the-badline.svg · the two must read as
    one system: solid white = CPU running, reduced-opacity white = CPU halted
    (the vocabulary's ░, time lost), accent = attention markers.
    PROPORTION: the real duty is 40 of ~500 µs. The ASCII draws halted spans as
    wide as running ones, which inverts the truth · here each cycle is 200u
    running to 40u halted. Schematic, not to scale, but the right way round.
  -->
  <rect width="860" height="340" fill="#111"/>

  <text id="cpu-label" x="40" y="114" font-family="'Open Sans', sans-serif" font-size="26" font-weight="600" fill="#fff">CPU</text>

  <!-- the timeline: ████ running · ░░ halted, three cycles -->
  <g>
    <rect x="110" y="80" width="200" height="50" fill="#fff"/>
    <rect x="310" y="80" width="40"  height="50" fill="#fff" opacity="0.25"/>
    <rect x="350" y="80" width="200" height="50" fill="#fff"/>
    <rect x="550" y="80" width="40"  height="50" fill="#fff" opacity="0.25"/>
    <rect x="590" y="80" width="200" height="50" fill="#fff"/>
    <rect x="790" y="80" width="40"  height="50" fill="#fff" opacity="0.25"/>
  </g>

  <!-- ▲ solid triangles under two of the halted slices -->
  <g fill="#e7ad52">
    <path d="M330 138 L321 158 L339 158 Z"/>
    <path d="M570 138 L561 158 L579 158 Z"/>
  </g>

  <!-- LABEL REGION · translated.
       claude:region id="annotation-halts" x="200" y="172" width="290" height="66"
