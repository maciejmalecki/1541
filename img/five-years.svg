<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-labelledby="t d">
  <title id="t">Five years to ship the bus as designed</title>
  <desc id="d">Transfer speeds by year on one shared scale: the 1980 design intent above 10 KB per second; the 1981 VIC-20 and 1540 at about 2 after the bug and workaround; the 1982 C64 and 1541 below 1, worse; community fastloaders reaching about 16 in 1984; and Commodore's own C128 and 1571 at about 2.1 in 1986, at last.</desc>
  <!--
    Generated by the svg-diagram skill.
    Source: the fenced ASCII block at decks/c64-1541/slides.md:616 (slide "Commodore's fix: 1986").
    The bars are NOT in the ASCII: each renders its row's KB/s figure on ONE shared linear
    scale, 35u per KB/s (1980 uses 10, 1982 uses 0.9 for "under 1"). The 1984 fastloader row
    is the act's reversal, so its bar takes the accent AND its text is bold · the distinction
    is never colour alone. The other bars are white at reduced opacity.

    THEME TOKENS, read from src/theme/slides.scss:25-43 at generation time:
      $background-color #111    · $main-color / $heading-color #fff
      $active-color     #e7ad52
      $heading-font     'Montserrat', Impact, sans-serif
      $main-font        'Open Sans', sans-serif
    An external asset inherits no CSS from the deck, so these are presentation
    attributes. Recorded here so a theme change can find this figure.
  -->
  <rect width="860" height="460" fill="#111"/>

  <!-- 1980 · design intent · >10 KB/s -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1980" x="40" y="60" font-family="'Montserrat', Impact, sans-serif" font-size="30" letter-spacing="-0.03">1980</text>
    <text id="product-1980" x="145" y="60">design intent</text>
    <rect x="145" y="74" width="350" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1980" x="507" y="89">&gt; 10 KB/s</text>
  </g>

  <!-- 1981 · VIC-20/1540 · ~2 KB/s (bug + workaround) -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1981" x="40" y="145" font-family="'Montserrat', Impact, sans-serif" font-size="30" letter-spacing="-0.03">1981</text>
    <text id="product-1981" x="145" y="145">VIC-20/1540</text>
    <text id="note-1981" x="560" y="145" font-size="20" opacity="0.6">(bug + workaround)</text>
    <rect x="145" y="159" width="70" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1981" x="227" y="174">~2 KB/s</text>
  </g>

  <!-- 1982 · C64/1541 · <1 KB/s (worse) -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1982" x="40" y="230" font-family="'Montserrat', Impact, sans-serif" font-size="30" letter-spacing="-0.03">1982</text>
    <text id="product-1982" x="145" y="230">C64/1541</text>
    <text id="note-1982" x="560" y="230" font-size="20" opacity="0.6">(worse)</text>
    <rect x="145" y="244" width="32" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1982" x="189" y="259">&lt; 1 KB/s</text>
  </g>

  <!-- 1984 · fastloaders · ~16 KB/s (community) · THE ACCENTED ROW: the reversal the act
       builds to. Accent bar, bold year/product/speed · never colour alone. -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1984" x="40" y="315" font-family="'Montserrat', Impact, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.03">1984</text>
    <text id="product-1984" x="145" y="315" font-weight="700">fastloaders</text>
    <text id="note-1984" x="560" y="315" font-size="20" opacity="0.6">(community)</text>
    <rect x="145" y="329" width="560" height="18" fill="#e7ad52"/>
    <text id="speed-1984" x="717" y="344" font-weight="700" fill="#e7ad52">~16 KB/s</text>
  </g>

  <!-- 1986 · C128/1571 · ~2.1 KB/s (Commodore, at last) -->
  <g font-family="'Open Sans', sans-serif" font-size="22" fill="#fff">
    <text id="year-1986" x="40" y="400" font-family="'Montserrat', Impact, sans-serif" font-size="30" letter-spacing="-0.03">1986</text>
    <text id="product-1986" x="145" y="400">C128/1571</text>
    <text id="note-1986" x="560" y="400" font-size="20" opacity="0.6">(Commodore, at last)</text>
    <rect x="145" y="414" width="74" height="18" fill="#fff" opacity="0.55"/>
    <text id="speed-1986" x="231" y="429">~2.1 KB/s</text>
  </g>
</svg>
