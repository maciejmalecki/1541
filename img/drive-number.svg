<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" role="img" aria-labelledby="t d">
  <title id="t">Drive 0 is a drive number inherited from dual drives</title>
  <desc id="d">PET-era dual drives such as the 4040 and 8050 had two real mechanisms in one unit: drive 0 on the left, drive 1 on the right. The 1541 has one mechanism, so drive 0 is the only possible value.</desc>
  <!--
    Generated by the svg-diagram skill.
    Source: the fenced ASCII block at decks/c64-1541/slides.md:760 (slide
    &#8220;It is a drive number&#8221;).

    THEME TOKENS, read from src/theme/slides.scss:25-43 at generation time:
      $background-color #111    · $main-color / $heading-color #fff
      $active-color     #e7ad52
      $heading-font     'Montserrat', Impact, sans-serif
      $main-font        'Open Sans', sans-serif
    An external asset inherits no CSS from the deck, so these are presentation
    attributes. Recorded here so a theme change can find this figure.

    The cell division matters: the dual unit is ONE box (a single 3px outline)
    holding TWO mechanisms, divided by an interior 2px rule — not two boxes.
    The model numbers sit on their own sub-line so the translatable heading
    and the untranslated &#8220;(4040, 8050)&#8221; are separate elements.
  -->
  <rect width="860" height="350" fill="#111"/>

  <!-- ══ left column: the PET-era dual drive ══ -->
  <g font-family="'Montserrat', Impact, sans-serif" fill="#fff">
    <text id="heading-dual" x="40" y="52" font-size="30" letter-spacing="-0.03">PET-era dual drive</text>
  </g>
  <line x1="40" y1="66" x2="520" y2="66" stroke="#e7ad52" stroke-width="3"/>
  <line x1="40" y1="72" x2="520" y2="72" stroke="#e7ad52" stroke-width="1"/>
  <text id="models" x="40" y="100" font-family="'Open Sans', sans-serif" font-size="20" fill="#fff" opacity="0.7">(4040, 8050)</text>

  <!-- ONE unit, two cells: outer box 3px, interior divider 2px -->
  <rect x="50" y="130" width="420" height="110" fill="none" stroke="#fff" stroke-width="3"/>
  <line x1="260" y1="130" x2="260" y2="240" stroke="#fff" stroke-width="2"/>
  <g font-family="'Open Sans', sans-serif" text-anchor="middle" fill="#fff">
    <text id="cell0-number" x="155" y="176" font-size="22">drive 0</text>
    <text id="cell0-position" x="155" y="208" font-size="20" opacity="0.8">LEFT</text>
    <text id="cell1-number" x="365" y="176" font-size="22">drive 1</text>
    <text id="cell1-position" x="365" y="208" font-size="20" opacity="0.8">RIGHT</text>
  </g>
  <text id="real-left" x="155" y="274" font-family="'Open Sans', sans-serif" font-size="20" fill="#fff" opacity="0.85" text-anchor="middle">real</text>
  <text id="real-right" x="365" y="274" font-family="'Open Sans', sans-serif" font-size="20" fill="#fff" opacity="0.85" text-anchor="middle">real</text>

  <!-- column divider: not in the ASCII, but the two-column layout is implicit there -->
  <line x1="550" y1="30" x2="550" y2="320" stroke="#fff" stroke-width="1" opacity="0.2"/>

  <!-- ══ right column: the 1541 ══ -->
  <g font-family="'Montserrat', Impact, sans-serif" fill="#fff">
    <text id="heading-1541" x="580" y="52" font-size="30" letter-spacing="-0.03">1541</text>
  </g>
  <line x1="580" y1="66" x2="820" y2="66" stroke="#e7ad52" stroke-width="3"/>
  <line x1="580" y1="72" x2="820" y2="72" stroke="#e7ad52" stroke-width="1"/>

  <!-- one box, one mechanism; drive 0 sits on the same baseline as the cells
       across the divider so the eye compares like with like -->
  <rect x="580" y="130" width="240" height="110" fill="none" stroke="#fff" stroke-width="3"/>
  <text id="solo-number" x="700" y="176" font-family="'Open Sans', sans-serif" font-size="22" fill="#fff" text-anchor="middle">drive 0</text>

  <!-- claude:region id="solo-caption" x="570" y="252" width="260" height="90"
                     font-size="22" line-height="30" max-lines="3" anchor="middle"
       The ASCII's three lines (only / possible / value) are a monospace
       artifact, not three meanings: one wrapped string. -->
  <g id="solo-caption" font-family="'Open Sans', sans-serif" font-size="22" fill="#e7ad52" text-anchor="middle">
    <text x="700" y="280">only possible value</text>
  </g>
</svg>
