  <title id="t">The fix pins go to the wrong connector</title>
  <desc id="d">The 6526 CIA's serial pins SP1/CNT1 and SP2/CNT2 both run to the user port, which sits unused. No wire leads to the IEC connector below, where the fast protocol would have needed them: the connection is drawn broken and crossed out.</desc>
