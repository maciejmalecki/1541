<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" role="img" aria-labelledby="t d">
  <title id="t">The DOS lives in the drive, not the computer</title>
  <desc id="d">On an Apple II or PC, the DOS sits inside the computer, which drives a dumb mechanism. On a Commodore, the computer says &#8220;LOAD this&#8221; over two wires to a second computer, and the DOS lives inside that one.</desc>
  <!--
    Generated by the svg-diagram skill.
    Source: the fenced ASCII block at decks/c64-1541/slides.md:649 (slide
    &#8220;The C64 has no disk operating system&#8221;).

    THEME TOKENS, read from src/theme/slides.scss:25-43 at generation time:
      $background-color #111    · $main-color / $heading-color #fff
      $active-color     #e7ad52
      $heading-font     'Montserrat', Impact, sans-serif
      $main-font        'Open Sans', sans-serif
    An external asset inherits no CSS from the deck, so these are presentation
    attributes. Recorded here so a theme change can find this figure.

    The figure's argument is WHERE the accent DOS box sits: top of the left
    column, bottom of the right. The two nested DOS boxes are the same size
    (90×52) at the same offset (+55,+48) within their COMPUTER boxes, so the
    eye compares positions, not shapes.
  -->
  <rect width="860" height="410" fill="#111"/>

  <!-- ══ left column: APPLE II / PC ══ -->
  <g font-family="'Montserrat', Impact, sans-serif" fill="#fff">
    <text id="heading-apple" x="40" y="52" font-size="30" letter-spacing="-0.03">APPLE II / PC</text>
  </g>
  <line x1="40" y1="66" x2="360" y2="66" stroke="#e7ad52" stroke-width="3"/>
  <line x1="40" y1="72" x2="360" y2="72" stroke="#e7ad52" stroke-width="1"/>

  <!-- the host, with the DOS inside it -->
  <rect x="100" y="100" width="200" height="130" fill="none" stroke="#fff" stroke-width="3"/>
  <text id="host-left-label" x="200" y="132" font-family="'Open Sans', sans-serif" font-size="22" fill="#fff" text-anchor="middle">COMPUTER</text>
  <rect x="155" y="148" width="90" height="52" fill="#e7ad52"/>
  <text id="dos-left-label" x="200" y="182" font-family="'Open Sans', sans-serif" font-size="22" fill="#111" font-weight="600" text-anchor="middle">DOS</text>

  <!-- │ dumb : the connector down to a mechanism with no brain of its own -->
  <line x1="200" y1="230" x2="200" y2="288" stroke="#fff" stroke-width="2"/>
  <text id="link-left-label" x="214" y="266" font-family="'Open Sans', sans-serif" font-size="22" fill="#fff" opacity="0.85">dumb</text>
  <rect x="100" y="288" width="200" height="64" fill="none" stroke="#fff" stroke-width="3"/>
  <text id="mechanism-label" x="200" y="328" font-family="'Open Sans', sans-serif" font-size="22" fill="#fff" text-anchor="middle">MECHANISM</text>

  <!-- column divider: not in the ASCII, but the two-column layout is implicit there -->
  <line x1="430" y1="30" x2="430" y2="380" stroke="#fff" stroke-width="1" opacity="0.2"/>

  <!-- ══ right column: COMMODORE ══ -->
  <g font-family="'Montserrat', Impact, sans-serif" fill="#fff">
    <text id="heading-commodore" x="470" y="52" font-size="30" letter-spacing="-0.03">COMMODORE</text>
  </g>
  <line x1="470" y1="66" x2="820" y2="66" stroke="#e7ad52" stroke-width="3"/>
  <line x1="470" y1="72" x2="820" y2="72" stroke="#e7ad52" stroke-width="1"/>

  <!-- the host: no DOS inside, it can only ask -->
  <rect x="490" y="100" width="200" height="64" fill="none" stroke="#fff" stroke-width="3"/>
  <text id="host-right-label" x="590" y="140" font-family="'Open Sans', sans-serif" font-size="22" fill="#fff" text-anchor="middle">COMPUTER</text>

  <!-- claude:region id="utterance" x="700" y="100" width="150" height="80"
                     font-size="22" line-height="28" max-lines="3" anchor="start" -->
  <g id="utterance" font-family="'Open Sans', sans-serif" font-size="22" font-style="italic" fill="#fff" opacity="0.85">
    <text x="705" y="140">&#8220;LOAD this&#8221;</text>
  </g>
  <line x1="692" y1="132" x2="701" y2="132" stroke="#fff" stroke-width="1" opacity="0.35"/>

  <!-- │ 2 wires : the whole interface between the two computers -->
  <line x1="590" y1="164" x2="590" y2="240" stroke="#fff" stroke-width="2"/>
  <text id="link-right-label" x="604" y="208" font-family="'Open Sans', sans-serif" font-size="22" fill="#fff" opacity="0.85">2 wires</text>

  <!-- the drive: a second computer, and the DOS lives HERE -->
  <rect x="490" y="240" width="200" height="130" fill="none" stroke="#fff" stroke-width="3"/>
  <text id="drive-right-label" x="590" y="272" font-family="'Open Sans', sans-serif" font-size="22" fill="#fff" text-anchor="middle">COMPUTER</text>
  <rect x="545" y="288" width="90" height="52" fill="#e7ad52"/>
  <text id="dos-right-label" x="590" y="322" font-family="'Open Sans', sans-serif" font-size="22" fill="#111" font-weight="600" text-anchor="middle">DOS</text>
</svg>
