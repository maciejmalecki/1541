# Napęd, który walczył z własnym komputerem

## Commodore 1541 i o tym, jak nie budować systemu

Note:
UWAGI DLA PRELEGENTA — PRZECZYTAJ NAJPIERW

Cel: ~45 min. Oba zestawy cięć są zastosowane — pozycje 1-4 z Dodatku A oraz
cięcia C1/C3/C4 w Akcie 2 z speech-cutdown-analysis.md. To jest wersja
45-minutowa, nie 55-minutowa; pełny materiał leży w gicie.

W czterech miejscach trzeba POWIEDZIEĆ zdanie nad slajdem, który przetrwał,
bo slajd stawiający daną tezę został wycięty. Są oznaczone w uwagach: detal
o strefach (Akt 1), wprowadzenie o cenach (Akt 0.5), wątek o uczciwości
projektu rozproszonego (Akt 3) oraz potwierdzające liczby o napędach (Akt 4).

Mapa dowodów i zastrzeżenia do tez: speech-syllabus.md, Dodatki B i C.

TRZY RZECZY DO POWIEDZENIA DOKŁADNIE TAK, JAK NAPISANO, bo to one dzielą
wykład, który przetrwa pytania, od takiego, który nie przetrwa. Lokalizowane
po TYTULE SLAJDU, nie po numerze — numery już raz się przesunęły i przesuną
się znowu:
  1. Liczba „wszystkie poza trzema" od sprzedawcy to jego wspomnienie, a nie
     wskaźnik awaryjności. -> slajd „Szkody były prawdziwe"
  2. Nigdy nie mów „40 razy" o liczbie uderzeń głowicy — nie jest to
     potwierdzone źródłem pierwotnym. Mów „wielokrotnie".
     -> slajd „[zagraj terkot jeszcze raz]"
  3. Prędkości fastloaderów są rzędu wielkości. Mów „około czterdziestu razy",
     nie podawaj liczby bajtów. -> slajd „Społeczność pobiła pierwotny cel
     projektowy" (to zastrzeżenie trafiło tutaj, gdy wycięto tabelę prędkości)

Myśl przewodnia do powtórzenia przy każdej przerwie aktu: poprawka istniała
i nie została zastosowana.

<section data-markdown>
	<script type="text/template">
## Po co w ogóle kodować?

Silniki napędowe różnią się między egzemplarzami.

Długiego ciągu identycznych bitów **nie da się wiarygodnie zliczyć**.

<br>

![Schemat przepływu: tablica o 16 wpisach koduje każde 4 bity danych jako 5 bitów na dysku, pod regułą nie więcej niż dwóch zer pod rząd, wewnątrz grupy i na styku grup.](img/gcr-encoding.pl.svg)

Note:
GCR. Najpierw ograniczenie FIZYCZNE. Silniki napędowe w różnych napędach
kręcą się z nieco różną prędkością, więc długiego ciągu identycznych bitów
nie da się wiarygodnie zliczyć. Więcej niż dwa zera pod rząd są niedozwolone.

Stąd 4 bity -> 5 bitów z tablicy o 16 wpisach, zbudowanej tak, by
ograniczenie przetrwało NA STYKU sklejonych grup, a nie tylko wewnątrz nich.
	</script>
</section>
