## Why not just use tape?

![Tape is sequential: reaching F means winding past A to E. Disk is random access: the head moves straight to the track](img/tape-vs-disk.svg)

Note:

The tempting answer is "floppies are tougher". True, irrelevant. The difference
is categorical: tape is sequential, disk is random-access. Not a better tape —
a different data structure.

## The geometry problem

![A disk platter drawn as concentric tracks: the outermost track is 46% longer than the innermost, yet a constant-sectors format stores the same on both, wasting the outer disk](img/track-geometry.svg)

Note:
Zoned recording. Start with the geometric problem, not the solution — the
audience should feel the waste before seeing the fix.

Track 1 is 46% longer than track 35. A constant-sectors format throws that away.

The zone table is cut (Appendix A item 2). The 46% fact on this slide is what
carries the point; the table was detail.

SAY, over this slide: "So the 1541 varies the bit rate by radius — four zones,

recording, years before the industry standardised on it."
	</script>

<section data-markdown>
	<script type="text/template">
## Why encode at all?

Spindle motors vary between drives.

A long run of identical bits **cannot be counted reliably**.

<br>

![Flow diagram: a 16-entry table encodes every 4 data bits as 5 bits on disk, under the rule of never more than two consecutive zeros, within a group and across groups.](img/gcr-encoding.svg)

Note:
GCR. Physical constraint FIRST. Spindle motors in different drives run at
slightly different speeds, so a long run of identical bits cannot be counted
reliably. More than two consecutive zeros is not permitted.

Hence 4 bits -> 5 bits from a 16-entry table, built so the constraint survives
ACROSS concatenated groups, not just within them.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The encoding creates its own punctuation

Encoded data can **never** contain a long run of 1-bits.

<br>

![A stream of encoded bits in which a run of ten 1-bits stands out in accent: impossible in encoded data, so it serves as the sector sync mark](img/sync-mark.svg)

### The constraint doesn't just protect the data — it delimits it.

Note:
The elegant consequence. Dwell here — it is the prettiest idea in Act 1.

Because encoded data can never contain a long run of 1-bits, a run of ten
1-bits is unambiguous. That is the sector sync mark. The encoding creates its
own punctuation.
	</script>
</section>

Tramiel: get off IEEE-488 —
> *"make it a cable anyone can manufacture"*

<br>

Design intent, 1980:

## ~4 µs/bit · **> 10 KB/s**
### hardware shift register, in silicon

Note:

<section data-markdown>
	<script type="text/template">
## The bug

The 6522's shift register **drops a bit** when an external pulse
coincides with an internal clock edge.

<br>

Butterfield, first-hand:

> *"the silicon guys had application notes about
> the problem, long since"*

> *"...by which time the VIC-20 board
> was in manufacture."*

Note:
The bug. 6522 shift register loses a bit when an external pulse coincides with
an internal clock edge.

The critical framing: this was NOT an engineering failure. It was a
COMMUNICATION failure. The company already knew.
	</script>
</section>

<section class="lead" data-markdown>
	<script type="text/template">
## Not an engineering failure.

## A **communication** failure.

### The company knew. The team that depended on it did not.

Note:
Say this precisely. It is the most quotable framing in the talk.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The workaround

![Two bars on one scale contrast the designed 4 µs per bit of the hardware shift register with the shipped 20 µs per bit of CPU bit-banging at both ends.](img/bit-banging.svg)

> a *"bit-catcher"* instead of a *"character-catcher"*

**8× the CPU work · 5–6× slower than planned**

Note:
The workaround: full retreat to CPU bit-banging. 4 µs -> 20 µs per bit.

Butterfield's phrase is the keeper: the machine became a "bit-catcher" instead
of a "character-catcher". Eight times the CPU work.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The C64 has working shift registers

### So it was fixed. Obviously.

<br><br>

### ...three reasons it wasn't.

Note:
ACT 2's CENTRAL TURN. The audience expects the C64 to fix this — new machine,
new CIA chips with WORKING shift registers.

Three facts defeat that. Deliver them in this order, as a sequence of closing
doors.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## 1. The drive kept the buggy chip

![The C64 has the fixed 6526 CIA but the 1541 kept the buggy 6522 VIA, and the bracket joining them notes the protocol needs working silicon at both ends.](img/both-ends.svg)

The 1541 is a lightly revised 1540.

**Changing the drive cost money.**

Note:
Door 1. A hardware-shifted protocol needs working silicon at BOTH ends. The
1541 is a lightly revised 1540 and kept the 6522.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## 2. The fix pins go to the wrong connector

![The 6526 CIA's SP and CNT pins run to the unused user port; the wire toward the IEC connector is broken and crossed out because it was never made.](img/pins-wrong-connector.svg)

Not a ROM patch away — it needed a **board rewire**.

*The C128 did exactly that, on the idle SRQ line.*

Note:
Door 2. The best fact in the act. The fix pins physically go to the wrong
connector — SP/CNT are routed to the USER PORT, not the IEC connector.

Enabling the fast protocol was not a ROM patch. It needed a board rewire. The
C128 did exactly that, using the previously idle SRQ line.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## 3. The VIC-II sabotaged it

![A CPU timeline in which badline DMA halts the CPU for about 40 microseconds every roughly 500, breaking the 20 microsecond software bit timing.](img/badline-timeline.svg)

Commodore's answer: relax the protocol **asymmetrically**.

Device → computer: **~60 µs/bit**. Under 1 KB/s.

Note:
Door 3. The VIC-II. Badline DMA halts the CPU ~40 µs every ~500 µs, breaking
the 20 µs software timing during receive.

Rather than gate transfers on video timing, Commodore relaxed the protocol
ASYMMETRICALLY. Remember this choice — Act 2.4 comes back to it.
	</script>
</section>

<section class="lead" data-markdown>
	<script type="text/template">

### The chip that sold the machine sabotaged its disk I/O.

<section data-markdown>
	<script type="text/template">
## Dodge the badline — don't accommodate it

![Commodore's row is one permanently slowed bar while the fastloader row transfers in wide bursts between narrow periodic badline gaps, which makes the interference schedulable.](img/dodge-the-badline.svg)

### Commodore paid a **permanent global cost**
### to avoid a **locally avoidable** problem.

Note:
THE SHARPEST POINT IN THE TALK. Never cut it. (Appendix A protects this as
"§2.4 item 3" — the numbering is gone from the slides after C1, but this is
the slide that reference means.)

Commodore's answer to VIC-II interference was to slow the ENTIRE PROTOCOL,
permanently. Fastloaders check the raster and transfer in the gap — because
the interference is periodic and therefore schedulable.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## What actually cost the 40×

The bug removed the **hardware** path.

The software replacement then conceded **far more than the bug required.**

<br>

### A protocol written to be safe against **unknown** hardware

### ...on a bus where the only peripheral's clock rate

### was known **exactly**.

Note:
The synthesis of Act 2. This is the sentence the act exists to earn.

The bug removed the hardware path. The software replacement then conceded far
more than the bug required — because it was written to be safe against
peripherals whose timing it did not know, on a bus where the only peripheral's
clock rate was known exactly.
	</script>
</section>

	<script type="text/template">
## Commodore's fix: 1986

**C128 / 1571 — Fast Serial.** The 1980 design, finally shipped.

<br>

![Transfer speeds on one scale: design intent above 10 KB/s in 1980, the VIC-20 and C64 shipping at no more than about 0.5 and about 0.4 KB/s, community fastloaders reaching about 5 to 6 KB/s in 1984, Commodore's own fix arriving at 4 to 5 KB/s in 1986, and Transwarp setting the 19 KB/s record — about fifty times stock — on the same wire in 2020.](img/five-years.svg)

### Five years. Three machine generations.

Note:
Close Act 2. Commodore's own fix, Fast Serial, arrived in 1986 with the
C128/1571 — five years and three machine generations to ship the bus as
designed, while third parties had already beaten it from userland.

<section data-markdown>
	<script type="text/template">
## The C64 has no disk operating system

![Where the DOS lives: an Apple II or PC keeps DOS inside the computer above a dumb mechanism, while a Commodore says "LOAD this" over two wires to a second computer that holds the DOS.](img/dos-location.svg)

Note:
The C64 has no disk operating system. DOS 2.6 lives in the drive and runs on
the drive's CPU. The host cannot enumerate a directory except by LOADING it as
though it were a program.

This is the inverse of Apple DOS 3.3 and PC DOS.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## Talking to a peer

![Channels 0 to 14 flow to file data, each bound to a filename; channel 15 flows to commands in and status out.](img/channels.svg)

<br>

```basic
OPEN 15,8,15
PRINT#15,"S0:OLDFILE"      : REM scratch
INPUT#15,A$                : REM  "01, FILES SCRATCHED,01,00"
```

### Errors are a **conversation**: `23,READ ERROR,18,00`

Note:
The channel model. The IEC secondary address IS the channel number — the
abstraction is bus-level, not software-level.

Errors come back as conversation.

The fairness slide is cut (Appendix A item 4). BE FAIR ANYWAY — say it in one
sentence over this slide, because it makes the criticism that follows land
harder, not softer:

"And this aged well in one respect — several computers can share one drive with
no host coordination, and the drive outlives its host's software. Commodore got
something real here."

Then turn on "And yet."
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## And yet

To delete a file:

```basic
OPEN 15,8,15,"S0:OLDFILE":CLOSE 15
```

**BASIC 2.0 has no disk commands. At all.**

<br>

The wedges and fastload cartridges everyone remembers
were patching a hole in **BASIC** — not in the drive.

*BASIC 3.0 had the commands. The C64 shipped the older one.*

Note:
And yet. BASIC 2.0 has no disk commands at all. To delete a file you open a
communications channel to a peer device and send it a string.

The wedges and fastload cartridges everyone remembers were patching a hole in
BASIC — not in the drive. BASIC 3.0 had the commands. The C64 shipped the
older one.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## A question for the room

# LOAD"0:GAME",8

<br>

### What is the `0:` for?

Note:
THE FOSSIL — 4 min. Ask the room first. Most will say "nothing" or "habit".
Let two or three people answer before revealing.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## It is a drive number

![PET-era dual drives like the 4040 and 8050 had a real drive 0 and drive 1 in one unit; on the 1541, drive 0 is the only possible value.](img/drive-number.svg)

Note:
It is a drive number. On a 1541 it can only ever be zero.

CBM DOS was written for the PET-era DUAL drives, where drive 0 was the left
mechanism and drive 1 the right. The 1541's DOS is derivative of that code.
	</script>
</section>

<section class="lead" data-markdown>
	<script type="text/template">
## Every `0:` ever typed on a C64

## addresses the **left-hand mechanism**

## of a dual drive that owner never had.

Note:
Land it hard. This is the emotional centre of Act 3.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The C64 has two fossils

| | fossilised in | |
|---|---|---|
| **Ultimax mode** | silicon | a console's memory map, in every PLA |
| **`0:`** | **the user interface** | a dual drive's addressing, typed by hand |

<br>

### One was baked in at manufacture.

### The other was typed by hand, millions of times a day, for a decade.

Note:
Tie back to Ultimax. The subject already frames Ultimax as "a foreign machine's
memory map fossilised in every C64". This is the same phenomenon — except
fossilised in the USER INTERFACE, typed by hand, millions of times a day, for a
decade.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The fossil is not decorative

`SAVE"@0:NAME"` — save-with-replace — **corrupts data.**

Slaymaker, *The Transactor*, September 1986:

> on directory access the drive *"tries to initialize drive 1
> if no drive was specified"* — allocating a buffer to
> **"the phantom drive 1 (not present in a 1541 drive)"**

Note:
The fossil bites. SAVE"@..." corrupts data, and Slaymaker's 1986 disassembly
shows why in the DOS's own terms.

"Phantom drive 1 (not present in a 1541 drive)" is HIS phrase — primary source,
read in full.
	</script>
</section>

<section class="lead" data-markdown>
	<script type="text/template">
## A vestigial structure that corrupts real data

## is not a leftover.

## It is an **unpaid migration cost**.

Note:
Land Act 3. Then the accuracy note — say it out loud, it costs five seconds.

The folk workaround "always type 0: when saving" is INSUFFICIENT. Slaymaker
tested it: any directory access without a drive number can arm the bug.

## One last thing

The drive was a computer. **The community treated it as one.**

- fastloaders that beat the factory design goal
- copy protection running on the drive's own CPU
- demos using the 1541 as a **maths co-processor**

<br>

### The openness Commodore never designed —

### arrived at by accident.

### It is why we are still talking about it.

# Questions

Note:
Q&A. Likely questions and where the answers live:

- "Why not just use the parallel port?" — DolphinDOS did; needs a cable, ~23x.
  Transwarp got ~40x with no hardware at all (Act 2.4).
- "Was the 1541 slower than competitors?" — yes; Apple II Disk II was ~15 KB/s.
  Worth noting the Disk II was Wozniak's design and famously minimal hardware.
- "Did Commodore ever fix the C64 itself?" — no. Every fix went to a successor.
  That is Act 5.
- "How fast was the 1571?" — Fast Serial ~2.1 KB/s standard, faster in Burst.
  Still below what fastloaders achieved on a 1541.
