<section data-markdown>

## 1967: a bootstrap problem

> *"an inexpensive system for loading microcode
> into the controller for the IBM 3330"*

<br>

The System/370 kept its microcode in **volatile memory**.

Every power-up needed it **reloaded** — from something cheap and mailable.

Note:
Defeat the obvious assumption immediately: the floppy was not invented to store
your data.

IBM 1967. Shugart assigns David Noble. The problem is Initial Control Program
Load — the System/370 was IBM's first family keeping microcode in VOLATILE
memory, so it had to be reloaded on every power-up, from something cheap enough
to post to a customer.
	</script>
</section>

## Why not just use tape?

![Tape is sequential: reaching F means winding past A to E. Disk is random access: the head moves straight to the track](img/tape-vs-disk.svg)

```
  TAPE — sequential            DISK — random access
  ════════════════             ═══════════════════

  ▶───────────────▶                  ┌───────┐
  wind to position                   │  ╱─╲  │
                                     │ │ ● │ │  head moves
  [A][B][C][D][E][F]                 │  ╲─╱  │  straight to
   ↑                                 └───────┘  the track
   must pass everything
   to reach [F]
```

### Not a **better tape**. A **different data structure**.

Note:
THE KEY SLIDE OF THIS ACT. If you cut everything else in 0.5, keep this.

The tempting answer is "floppies are tougher". True, irrelevant. The difference
is categorical: tape is sequential, disk is random-access. Not a better tape —
a different data structure.
	</script>
</section>

```
        outer track — long
       ╭────────────────────╮

     │ │  │  ╰──╯   │    │    │      than track 35

      ╲  ╰──────────────╯    ╱
       ╰────────────────────╯
        same sectors on both = wasted disk
```

<section data-markdown>
	<script type="text/template">
## Four speed zones

| Tracks | Sectors | µs/byte |
|---|---|---|
| 1–17 | **21** | 26 |
| 18–24 | 19 | 28 |
| 25–30 | 18 | 30 |
| 31–35 | **17** | 32 |

### Zone-bit recording — years before the industry standardised on it

Note:
The fix: vary the bit rate by radius. Four zones.

Landing point — this is zone-bit recording, and it became a wider industry norm
considerably later.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## Why encode at all?

Spindle motors vary between drives.

A long run of identical bits **cannot be counted reliably**.

<br>

```
  rule:  never more than 2 consecutive zeros
         — within a group AND across groups

  4 data bits  ──────►  5 bits on disk
                        (16-entry table)
```

Note:
GCR. Physical constraint FIRST. Spindle motors in different drives run at
slightly different speeds, so a long run of identical bits cannot be counted
reliably. More than two consecutive zeros is not permitted.

Hence 4 bits -> 5 bits from a 16-entry table, built so the constraint survives
ACROSS concatenated groups, not just within them.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The encoding creates its own punctuation

Encoded data can **never** contain a long run of 1-bits.

<br>

```
  ...0101101011  1111111111  0110101101...
                 ▲▲▲▲▲▲▲▲▲▲
                 ten 1-bits = impossible in data
                            = SECTOR SYNC MARK
```

### The constraint doesn't just protect the data — it delimits it.

Note:
The elegant consequence. Dwell here — it is the prettiest idea in Act 1.

Because encoded data can never contain a long run of 1-bits, a run of ten
1-bits is unambiguous. That is the sector sync mark. The encoding creates its
own punctuation.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The bug

The 6522's shift register **drops a bit** when an external pulse
coincides with an internal clock edge.

<br>

Butterfield, first-hand:

> *"the silicon guys had application notes about
> the problem, long since"*

> *"the Commodore engineers, who only made the chip,
> didn't know this. Until they got into final checkout
> of the VIC-20"* — *"by which time the VIC-20 board
> was in manufacture."*

Note:
The bug. 6522 shift register loses a bit when an external pulse coincides with
an internal clock edge.

The critical framing: this was NOT an engineering failure. It was a
COMMUNICATION failure. The company already knew.
	</script>
</section>

<section class="lead" data-markdown>
	<script type="text/template">
## Not an engineering failure.

## A **communication** failure.

### The company knew. The team that depended on it did not.

Note:
Say this precisely. It is the most quotable framing in the talk.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The workaround

```
   designed:   4 µs/bit   ── hardware shift register
                  │
                  ▼
   shipped:   20 µs/bit   ── CPU bit-banging, both ends
```

> a *"bit-catcher"* instead of a *"character-catcher"*

**8× the CPU work · 5–6× slower than planned**

Note:
The workaround: full retreat to CPU bit-banging. 4 µs -> 20 µs per bit.

Butterfield's phrase is the keeper: the machine became a "bit-catcher" instead
of a "character-catcher". Eight times the CPU work.
	</script>
</section>

### So it was fixed. Obviously.

<br><br>

### ...three reasons it wasn't.

<section data-markdown>
	<script type="text/template">
## 1. The drive kept the buggy chip

```
   C64  ──── 6526 CIA ✓ ────┐
                            │  needs working silicon
                            │  at BOTH ends
   1541 ──── 6522 VIA ✗ ────┘
```

The 1541 is a lightly revised 1540.

**Changing the drive cost money.**

Note:
Door 1. A hardware-shifted protocol needs working silicon at BOTH ends. The
1541 is a lightly revised 1540 and kept the 6522.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## 2. The fix pins go to the wrong connector

```
        6526 CIA
        SP1/CNT1 ────────────►  USER PORT     (unused)
        SP2/CNT2 ────────────►  USER PORT     (unused)

                    ✗ not wired to ►  IEC CONNECTOR
```

Not a ROM patch away — it needed a **board rewire**.

*The C128 did exactly that, on the idle SRQ line.*

Note:
Door 2. The best fact in the act. The fix pins physically go to the wrong
connector — SP/CNT are routed to the USER PORT, not the IEC connector.

Enabling the fast protocol was not a ROM patch. It needed a board rewire. The
C128 did exactly that, using the previously idle SRQ line.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## 3. The VIC-II sabotaged it

```
  CPU  ████████░░░░░░░░████████░░░░░░░░████████
               ▲                ▲
          badline DMA      every ~500 µs
          halts CPU ~40 µs

  ...which breaks 20 µs software bit timing.
```

Commodore's answer: relax the protocol **asymmetrically**.

Device → computer: **~60 µs/bit**. Under 1 KB/s.

Note:
Door 3. The VIC-II. Badline DMA halts the CPU ~40 µs every ~500 µs, breaking
the 20 µs software timing during receive.

Rather than gate transfers on video timing, Commodore relaxed the protocol
ASYMMETRICALLY. Remember this choice — Act 2.4 comes back to it.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## What the shipped protocol left on the table

**1. The second wire**

```
   KERNAL:      CLK ── clock        DATA ── data     1 bit/event
   fastloader:  CLK ── data         DATA ── data     2 bits/event
```

<br>

**2. Agreement instead of handshaking**

Both CPUs run ~1 MHz → **cycle-match** instead of acknowledging every bit.

> *"14 clock cycles delay for PAL and 15 for NTSC"*

PAL vs NTSC = **one instruction** on the C64 side. Drive code: unchanged.

Note:
Four capabilities. Items 1 and 4 are cuttable; items 2 and 3 are not.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## 3. Dodge the badline — don't accommodate it

```
  Commodore:   slow the ENTIRE PROTOCOL, permanently
               ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░

  Fastloader:  wait for the badline, transfer in the gap
               ████░░░░████░░░░████░░░░████░░░░
                   ▲       ▲       ▲
                   periodic = schedulable
```

### Commodore paid a **permanent global cost**
### to avoid a **locally avoidable** problem.

Note:
ITEM 3 IS THE SHARPEST POINT IN THE TALK. Never cut it.

Commodore's answer to VIC-II interference was to slow the ENTIRE PROTOCOL,
permanently. Fastloaders check the raster and transfer in the gap — because
the interference is periodic and therefore schedulable.
	</script>
</section>

```
   M-W   memory-write    ──►  upload code into drive RAM
   M-E   memory-execute  ──►  jump to it
```

Uploaded **over the slow protocol**, then run on the drive's own 6502.

Nothing rewired. Nothing patched in the host ROM.

Note:
Item 4. The drive's own DOS ships the subversion mechanism. Upload over the
slow protocol, execute on the drive's CPU. Nothing rewired.

<section data-markdown>
	<script type="text/template">
## The C64 has no disk operating system

```
   APPLE II / PC              COMMODORE
   ═════════════              ═════════

   ┌───────────┐              ┌───────────┐
   │ COMPUTER  │              │ COMPUTER  │
   │  ┌─────┐  │              │           │  "LOAD this"
   │  │ DOS │  │              └─────┬─────┘
   │  └─────┘  │                    │
   └─────┬─────┘                    │ 2 wires
         │ dumb                     │
   ┌─────┴─────┐              ┌─────┴─────┐
   │  MECHANISM│              │ COMPUTER  │
   └───────────┘              │  ┌─────┐  │
                              │  │ DOS │  │
                              │  └─────┘  │
                              └───────────┘
```

Note:
The C64 has no disk operating system. DOS 2.6 lives in the drive and runs on
the drive's CPU. The host cannot enumerate a directory except by LOADING it as
though it were a program.

This is the inverse of Apple DOS 3.3 and PC DOS.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## Talking to a peer

```
   channels 0–14   ──►  file data (each bound to a filename)
   channel  15     ──►  commands in, status out
```

<br>

```basic
OPEN 15,8,15
PRINT#15,"S0:OLDFILE"      : REM scratch
INPUT#15,A$                : REM  "01, FILES SCRATCHED,01,00"
```

### Errors are a **conversation**: `23,READ ERROR,18,00`

Note:
The channel model. The IEC secondary address IS the channel number — the
abstraction is bus-level, not software-level.

Errors come back as conversation.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## Credit where it is due

The drive interprets **high-level commands**, not block requests.

- several computers can share one drive, no host coordination
- the drive outlives its host's software
- the filesystem is not a library you must port

### This is a genuinely distributed design. It aged well.

Note:
BE FAIR HERE. This aged well in one respect: several computers can share a
drive with no host coordination, and a drive can outlive its host's software.
Commodore got something real.

Saying this makes the criticism land harder, not softer.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## And yet

To delete a file:

```basic
OPEN 15,8,15,"S0:OLDFILE":CLOSE 15
```

**BASIC 2.0 has no disk commands. At all.**

<br>

The wedges and fastload cartridges everyone remembers
were patching a hole in **BASIC** — not in the drive.

*BASIC 3.0 had the commands. The C64 shipped the older one.*

Note:
And yet. BASIC 2.0 has no disk commands at all. To delete a file you open a
communications channel to a peer device and send it a string.

The wedges and fastload cartridges everyone remembers were patching a hole in
BASIC — not in the drive. BASIC 3.0 had the commands. The C64 shipped the
older one.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## A question for the room

# LOAD"0:GAME",8

<br>

### What is the `0:` for?

Note:
THE FOSSIL — 4 min. Ask the room first. Most will say "nothing" or "habit".
Let two or three people answer before revealing.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## It is a drive number

```
   PET-era dual drive (4040, 8050)      1541
   ════════════════════════════════     ════

   ┌─────────┬─────────┐                ┌─────────┐
   │ drive 0 │ drive 1 │                │ drive 0 │
   │  LEFT   │  RIGHT  │                │         │
   └─────────┴─────────┘                └─────────┘
       real      real                       only
                                          possible
                                            value
```

Note:
It is a drive number. On a 1541 it can only ever be zero.

CBM DOS was written for the PET-era DUAL drives, where drive 0 was the left
mechanism and drive 1 the right. The 1541's DOS is derivative of that code.
	</script>
</section>

<section class="lead" data-markdown>
	<script type="text/template">
## Every `0:` ever typed on a C64

## addresses the **left-hand mechanism**

## of a dual drive that owner never had.

Note:
Land it hard. This is the emotional centre of Act 3.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The C64 has two fossils

| | fossilised in | |
|---|---|---|
| **Ultimax mode** | silicon | a console's memory map, in every PLA |
| **`0:`** | **the user interface** | a dual drive's addressing, typed by hand |

<br>

### One was baked in at manufacture.

### The other was typed by hand, millions of times a day, for a decade.

Note:
Tie back to Ultimax. The subject already frames Ultimax as "a foreign machine's
memory map fossilised in every C64". This is the same phenomenon — except
fossilised in the USER INTERFACE, typed by hand, millions of times a day, for a
decade.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The fossil is not decorative

`SAVE"@0:NAME"` — save-with-replace — **corrupts data.**

Slaymaker, *The Transactor*, September 1986:

> on directory access the drive *"tries to initialize drive 1
> if no drive was specified"* — allocating a buffer to
> **"the phantom drive 1 (not present in a 1541 drive)"**

Note:
The fossil bites. SAVE"@..." corrupts data, and Slaymaker's 1986 disassembly
shows why in the DOS's own terms.

"Phantom drive 1 (not present in a 1541 drive)" is HIS phrase — primary source,
read in full.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## How a ghost corrupts your disk

```
  buffers:  [0] [1] [2] [3] [4]
                      ▲
                      └── allocated to a drive that does not exist
                          ...and unstealable (it "errored")

  SAVE@ needs all 5.  Only 4 available.
        │
        └──►  steals the BAM instead
              │
              └──►  only 2 track-images fit
                    │
                    └──►  "may be updated correctly, be left
                           unchanged, or be fully allocated"
```

Note:
Walk the mechanism. Five buffers; save-with-replace needs all five; the phantom
holds one hostage because buffers with drive errors cannot be stolen; so DOS
steals the BAM instead; the two-track BAM-image limit does the rest.
	</script>
</section>

<section class="lead" data-markdown>
	<script type="text/template">
## A vestigial structure that corrupts real data

## is not a leftover.

## It is an **unpaid migration cost**.

The folk workaround "always type 0: when saving" is INSUFFICIENT. Slaymaker
tested it: any directory access without a drive number can arm the bug.

# Act 4
## The machine that broke itself

Note:
=========================================================

=========================================================
	</script>

<section data-markdown>
	<script type="text/template">
## 🔊 *[play the chatter again]*

The drive has **no track-zero sensor**.

After an error it cannot know where the head is.

```
   recalibration:  step out ──► step out ──► step out ──► ...
                                                    ▲
                              ┌─────────────────────┘
                              │  mechanical stop
                              │  (and keep going)
                         ═════╧═════
```

### That sound is the head being rammed out of alignment.

Note:
Return the sound from the cold open. Play it again, briefly.

The drive has no track-zero sensor, so after an error it cannot know where the
head is. It recalibrates the only way it can: drive the head outward until it
hits a mechanical stop — and keep going.

SAY "repeatedly" — NOT "40 times". That count is not verified from a primary.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The damage was real

*Compute!'s Gazette*, December 1983 — one multi-state service dealer:

> repaired *"several hundred"* drives — the head-alignment part
> *"was to blame in **all but three** cases"*

<br>

Independent corroboration, different population:

### **four of the magazine's own seven drives** failed the same way

Note:
The damage was real. Compute's Gazette, December 1983 — Robert Lock's editorial,
read at source.

THEN SAY THE CAVEAT OUT LOUD. It costs ten seconds and is the difference between
a talk that can be checked and one that cannot.

SAY THIS OUT LOUD: "That's one dealer's recollection relayed by an editor. No
methodology, no denominator. It's a strong signal — it is not a measured failure
rate."
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## The obvious moral is wrong

### "They saved money on a sensor."

<br>

## No.

### The 1541C **shipped with the sensor fitted**
### — and Commodore **disabled it at the factory.**

*There is a jumper, J3, to turn it back on.*

Note:
THE REVERSAL — the best twist in the talk. The obvious moral is "they saved
money on a sensor". That is WRONG.

The 1541C shipped the photo-sensor FITTED — and Commodore disabled it at the
factory. There is a jumper, J3, to turn it back on.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## Because the banging was doing a job

> a *"feature… installed by Commodore to eliminate a common
> problem with all 1541 drives… the drive getting **'lost'**
> past the directory track"*

> otherwise the drive *"might look defective to the user since
> turning it off and back on again does not restore normal
> operation"*

Note:
Why? Because the head-banging was DOING A JOB. Service documentation records it
as a deliberate feature.

Without it, a lost head produced a drive that could not be recovered by power-
cycling — so it looked broken to the user.
	</script>
</section>

<section data-markdown>
	<script type="text/template">
## A trade, not an oversight

```
   ACCEPT:   cumulative alignment damage
   TO GET:   a drive that always recovers to a known state
```

<br>

### And on the 1541C the pressure was **compatibility** —

### not cost.

Note:
So it is a trade, not an oversight. And note what the pressure was on the 1541C:
COMPATIBILITY, not cost. That connects to the installed-base thread rather than
the cost-cutting one.
	</script>
</section>
